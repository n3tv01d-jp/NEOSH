<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>NEOSH banner</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#1a0f33"/>
      <stop offset="1" stop-color="#07040f"/>
    </radialGradient>
    <radialGradient id="haze1" cx="18%" cy="30%" r="45%">
      <stop offset="0" stop-color="#5b2a9c" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5b2a9c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze2" cx="85%" cy="75%" r="45%">
      <stop offset="0" stop-color="#4a2390" stop-opacity=".4"/>
      <stop offset="1" stop-color="#4a2390" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity=".025"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#haze1)"/>
  <rect width="1280" height="640" fill="url(#haze2)"/>
  <rect width="1280" height="640" fill="url(#scan)"/>
  <!-- hexagon (same geometry as the HEARTH mark) -->
  <polygon points="640,48 870,180 870,460 640,592 410,460 410,180"
           fill="#05060d" stroke="#3ef3ff" stroke-width="26" stroke-linejoin="miter" filter="url(#glow)"/>
  <!-- prompt glyph -->
  <g fill="none" stroke="#ff3ea5" stroke-width="44" stroke-linecap="square" stroke-linejoin="miter">
    <polyline points="540,250 620,320 540,390"/>
  </g>
  <rect x="650" y="372" width="110" height="40" fill="#ff3ea5"/>
</svg>
