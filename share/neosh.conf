# ─────────────────────────────────────────────────────────────
#  NEOSH // 新殻 — configuration
#  This file is parsed, never executed: only the keys below are
#  read, and any value that doesn't validate is ignored.
#  Change things live with:  neo set KEY VALUE
# ─────────────────────────────────────────────────────────────

# hearth · redline · mecha · sakura · eclipse · kurenai · abyss · aurum · specter
theme=hearth

# startup banner: full (boot log) · compact (one line + KAGARI) · off
boot=compact

# auto · truecolor · 256 · off        (NO_COLOR is respected in auto)
color=auto

# auto · unicode · ascii              (auto uses ascii on the Linux console)
glyphs=auto

# on · off — off leaves PS1 completely alone
prompt=on

# KAGARI: greeting, error kaomoji, `command not found` message
navigator=on

clock=on
git=on
# runs `git status` (fsmonitor disabled) to show ● dirty / ✓ clean
git_dirty=on
# terminal window title
title=on
# blank line between prompts
spacing=on

# show runtime of commands slower than N seconds (0 = never)
duration=3
# path components shown before abbreviating with …
path_depth=4
